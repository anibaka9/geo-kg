# Generated by hand, not by `fly launch` — this app has not been created on
# Fly.io yet. Before the first real deploy, run `fly launch --no-deploy` from
# the repo root; it will detect this file, ask to reuse it, and register the
# `app` name below (or let you pick a different one if it's taken). See
# DEPLOY.md for the full remaining checklist.
app = "geo-kg"
primary_region = "fra"

[build]

[env]
PORT = "3000"
DATABASE_PATH = "/app/output/licenses.db"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "5s"
interval = "15s"
method = "GET"
path = "/"
timeout = "3s"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

# No [mounts]/volume on purpose — output/licenses.db is baked into the image
# at build time from data/*.csv (already in git), not stored on a persistent
# disk. See "Data: no volume" in DEPLOY.md for why, and the conditions under
# which that decision should be revisited.
