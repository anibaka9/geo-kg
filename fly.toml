# fly.toml app configuration file generated for geo-kg on 2026-08-22T13:29:07+06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'geo-kg'
primary_region = 'fra'

[build]
[env]
DATABASE_PATH = '/app/output/licenses.db'
PORT = '3000'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'suspend'
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
interval = '15s'
timeout = '3s'
grace_period = '5s'
method = 'GET'
path = '/'

[[vm]]
size = 'shared-cpu-1x'
memory = '512mb'
cpus = 1
memory_mb = 512
