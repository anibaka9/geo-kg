name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - run: bun run check
      - run: bun run format:check

      - run: bun run build
      - run: bun run parse

      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
